---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.10
    restart: unless-stopped
    container_name: ft-lab
    # Secrets (FreqUI password etc.) come from .env, never from config.json.
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    # FreqUI / REST API, reachable only from this computer (127.0.0.1).
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.voltarget.dryrun.sqlite
      --config /freqtrade/user_data/config/config.json
      --strategy TrendEmaVolTarget

  # Forward test (2026-11-01): a second dry-run bot with the best backtest rule,
  # judged on NEW prices only. Fake money, same risk rules. Not started by a plain
  # `docker compose up -d`; start it with `docker compose --profile forward up -d`.
  forward-pyramidbtc:
    image: freqtradeorg/freqtrade:2026.10
    profiles: ["forward"]
    restart: unless-stopped
    container_name: ft-lab-fwd-pyramidbtc
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8081:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/forward-pyramidbtc.log
      --db-url sqlite:////freqtrade/user_data/forward-pyramidbtc.dryrun.sqlite
      --config /freqtrade/user_data/config/config.json
      --config /freqtrade/user_data/config/forward-pyramidbtc.json
      --strategy TrendEmaPyramidBtc
