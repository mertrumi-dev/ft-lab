---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.10
    restart: unless-stopped
    container_name: ft-lab
    # Secrets (FreqUI password etc.) come from .env, never from config.json.
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    # FreqUI / REST API, reachable only from this computer (127.0.0.1).
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.voltarget.dryrun.sqlite
      --config /freqtrade/user_data/config/config.json
      --strategy TrendEmaVolTarget

  # Forward test (2026-11-01, replaced PyramidBtc after its final-test FAIL): a second dry-run
  # bot with TrendEmaVolTargetAdx (T108; passed the reserved judge in T111), judged on NEW prices
  # only, side by side with the main VolTarget bot. Fake money, same risk rules, own DB and port.
  # Not started by a plain `docker compose up -d`; start it with
  # `docker compose --profile forward up -d forward-adx20`.
  forward-adx20:
    image: freqtradeorg/freqtrade:2026.10
    profiles: ["forward"]
    restart: unless-stopped
    container_name: ft-lab-fwd-adx20
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8081:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/forward-adx20.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.adx20.dryrun.sqlite
      --config /freqtrade/user_data/config/config.json
      --config /freqtrade/user_data/config/forward-adx20.json
      --strategy TrendEmaVolTargetAdx
